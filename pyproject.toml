[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mbBench"
dynamic = ["version"]
description = "MicrobiomeBench: conditional microbiome simulation and truth-informed benchmarking"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=2.2,<3",
  "pandas>=2.3,<3",
  "PyYAML>=6,<7",
  "scipy>=1.15,<2",
  "scikit-learn>=1.7,<2",
  "torch>=2.6,<2.7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
mbbench = "mbbench.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["mbbench*"]

[tool.setuptools.package-data]
mbbench = ["defaults/*.yaml", "defaults/benchmark/*.yaml", "r/*.R"]

[tool.setuptools.dynamic]
version = {attr = "mbbench.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
