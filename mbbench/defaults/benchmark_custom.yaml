# Copy this file with:
#   mbbench benchmark --write-config-template my_benchmark.yaml
# Then edit it and run:
#   mbbench benchmark --config my_benchmark.yaml --output-dir runs/my_benchmark
schema_version: mbbench_benchmark_v1
preset: custom
description: Custom two-group benchmark.
model:
  type: ae
  directory: null
  guidance_scale: 1.25
  use_body_system: auto
conditions:
  common:
    Body_Site_Coarse: stool_feces
  groups:
    - {label: control, conditions: {Phenotype_Tokens: Healthy}}
    - {label: case, conditions: {Phenotype_Tokens: Healthy}}
design:
  n_samples: 240
  n_batches: 4
  mode: balanced
  case_fractions: null
  group_fractions: null
  minimum_cell_count: 8
biology:
  mode: strict
  n_targets: 12
  target_taxa: null
  prevalence_min: 0.30
  prevalence_max: 0.90
  effect_strength: 0.6931471805599453
  effect_directions: balanced
batch:
  mechanisms: []
support: {mode: temperature-bernoulli, threshold: 0.50, temperature: 0.60}
observation:
  model: dirichlet-multinomial
  depth_mode: model-donor
  depth_min: 1000
  depth_max: 150000
  concentration_mode: lognormal
  concentration_median: 1000
  concentration_log_sd: 0.45
  concentration_min: 250
  concentration_max: 4000
  paired_neutral_counts: false
runtime: {seed: 42, batch_size: 64, device: auto}
